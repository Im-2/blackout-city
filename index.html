<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f141c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen" />
    <meta name="apple-mobile-web-app-title" content="Blackout City" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Blackout City</title>
    <meta name="description" content="Cut the power. Rob the city. A low-poly open-city heist game." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
    <!-- shown instantly, while the game code downloads on a slow connection -->
    <style>#boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0f141c;color:#e8e2d0;font:bold 30px monospace;letter-spacing:5px;text-align:center}#boot i{display:block;width:180px;height:8px;background:#46e6ff;animation:b 1s steps(2) infinite}#boot small{font-size:13px;letter-spacing:2px;color:#8a8f98}@keyframes b{50%{opacity:.3}}</style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <div id="boot">BLACKOUT CITY<i></i><small>LOADING</small></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
